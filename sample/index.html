<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f1220;
        --ink: #ffffff;
        --accent: #ff6b9d;
        --accent2: #7c8cff;
        --font-display: "Inter", "Segoe UI", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      /* Personaje base */
      .char {
        position: absolute;
        bottom: 180px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        height: 260px;
      }
      .head {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff6b9d, #7c8cff);
        position: relative;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      }
      .eye { position: absolute; top: 90px; width: 44px; height: 56px; background: #fff; border-radius: 50%; overflow: hidden; }
      .eye.left { left: 60px; }
      .eye.right { right: 60px; }
      .pupil { position: absolute; top: 14px; left: 12px; width: 20px; height: 24px; background: #1a1f3a; border-radius: 50%; }
      .mouth { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); width: 80px; height: 40px; border-bottom: 6px solid #1a1f3a; border-radius: 0 0 60px 60px; }
      .arm { position: absolute; bottom: 40px; width: 24px; height: 120px; background: linear-gradient(180deg, #ff6b9d, #7c8cff); border-radius: 12px; transform-origin: top center; }
      .arm.left { left: 20px; }
      .arm.right { right: 20px; }
      .title {
        position: absolute;
        top: 120px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
      }
      .subtitle {
        position: absolute;
        top: 210px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.6);
        font-size: 32px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .bubble {
        position: absolute;
        top: 260px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 24px;
        padding: 16px 28px;
        color: #fff;
        font-size: 28px;
        opacity: 0;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .bg1 { background: radial-gradient(circle at 30% 40%, #1a1f3a, #0f1220); }
      .bg2 { background: radial-gradient(circle at 70% 30%, #2a1f3a, #0f1220); }
      .bg3 { background: radial-gradient(circle at 50% 60%, #1f2a3a, #0f1220); }
      .title2 { font-size: 96px; top: 140px; }
      .sub2 { font-size: 30px; top: 260px; }
      .title3 { font-size: 80px; top: 200px; }
      .sub3 { font-size: 28px; top: 300px; }
      .heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 120px; opacity: 0; }
      .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- Escena 1: 0-5s -->
      <div class="scene bg1 clip" data-start="0" data-duration="5" data-track-index="0" id="scene1">
        <h1 class="title clip" data-start="0.3" data-duration="4.7" data-track-index="1" id="t1">Hola, soy Pixel</h1>
        <p class="subtitle clip" data-start="0.6" data-duration="4.4" data-track-index="1" id="s1">Motion Graphics Demo</p>
        <div class="char clip" data-start="0" data-duration="5" data-track-index="2" id="c1">
          <div class="head">
            <div class="eye left"><div class="pupil"></div></div>
            <div class="eye right"><div class="pupil"></div></div>
            <div class="mouth"></div>
          </div>
          <div class="arm left"></div>
          <div class="arm right" id="ar1"></div>
        </div>
        <div class="bubble clip" data-start="1.5" data-duration="3.5" data-track-index="3" id="b1">Listo para animar ✨</div>
      </div>

      <!-- Escena 2: 5-10s -->
      <div class="scene bg2 clip" data-start="5" data-duration="5" data-track-index="0" id="scene2">
        <h1 class="title title2 clip" data-start="5.2" data-duration="4.8" data-track-index="1" id="t2">Motion</h1>
        <p class="subtitle sub2 clip" data-start="5.5" data-duration="4.5" data-track-index="1" id="s2">Graphics</p>
        <div class="char clip" data-start="5" data-duration="5" data-track-index="2" id="c2" style="bottom:160px;">
          <div class="head" style="background:linear-gradient(135deg,#7c8cff,#ff6b9d);">
            <div class="eye left"><div class="pupil"></div></div>
            <div class="eye right"><div class="pupil"></div></div>
            <div class="mouth"></div>
          </div>
          <div class="arm left" id="al2"></div>
          <div class="arm right" id="ar2" style="background:linear-gradient(180deg,#7c8cff,#ff6b9d);"></div>
        </div>
        <div class="clip" data-start="5" data-duration="5" data-track-index="3" id="particles2"></div>
      </div>

      <!-- Escena 3: 10-15s -->
      <div class="scene bg3 clip" data-start="10" data-duration="5" data-track-index="0" id="scene3">
        <h1 class="title title3 clip" data-start="10.3" data-duration="4.7" data-track-index="1" id="t3">Hasta pronto</h1>
        <p class="subtitle sub3 clip" data-start="10.6" data-duration="4.4" data-track-index="1" id="s3">Gracias por ver</p>
        <div class="char clip" data-start="10" data-duration="5" data-track-index="2" id="c3">
          <div class="head">
            <div class="eye left"><div class="pupil"></div></div>
            <div class="eye right"><div class="pupil"></div></div>
            <div class="mouth"></div>
          </div>
          <div class="arm right" id="ar3"></div>
        </div>
        <div class="heart clip" data-start="11.2" data-duration="3.8" data-track-index="3" id="heart3">❤️</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // === ESCENA 1 (0-5) ===
      tl.fromTo("#c1", { y: 400, opacity: 0, scale: 0.6 }, { y: 0, opacity: 1, scale: 1, duration: 0.9, ease: "back.out(1.6)" }, 0);
      tl.to("#ar1", { rotation: -60, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 3 }, 1.0);
      tl.fromTo("#t1", { opacity: 0, filter: "blur(8px)", y: 20 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.6, ease: "power4.out" }, 0.3);
      tl.fromTo("#s1", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.7);
      tl.fromTo("#b1", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.5);
      tl.to("#c1", { y: 200, opacity: 0, scale: 0.8, duration: 0.6, ease: "power3.in" }, 4.2);
      tl.to("#t1, #s1, #b1", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, 4.3);

      // === ESCENA 2 (5-10) ===
      tl.fromTo("#c2", { x: -300, opacity: 0, rotation: -15 }, { x: 0, opacity: 1, rotation: 0, duration: 0.7, ease: "power4.out" }, 5);
      tl.to("#al2", { rotation: -120, duration: 0.4, ease: "back.out(1.4)", yoyo: true, repeat: 2 }, 5.6);
      tl.to("#ar2", { rotation: 120, duration: 0.4, ease: "back.out(1.4)", yoyo: true, repeat: 2 }, 5.7);
      tl.fromTo("#t2", { opacity: 0, scale: 0.5, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 5.2);
      tl.fromTo("#s2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.7);
      // particulas
      const container = document.getElementById("particles2");
      for (let i = 0; i < 18; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = (40 + Math.random() * 20) + "%";
        p.style.top = "45%";
        p.style.background = i % 2 === 0 ? "#ff6b9d" : "#7c8cff";
        container.appendChild(p);
        const angle = (i / 18) * Math.PI * 2;
        const dist = 120 + Math.random() * 80;
        tl.fromTo(p, { opacity: 1, x: 0, y: 0, scale: 1 }, { opacity: 0, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist - 60, scale: 0.3, duration: 1.2, ease: "power2.out" }, 6.0);
      }
      tl.to("#c2, #t2, #s2", { opacity: 0, y: -60, filter: "blur(8px)", duration: 0.5, ease: "power2.in", stagger: 0.05 }, 9.3);

      // === ESCENA 3 (10-15) ===
      tl.fromTo("#c3", { y: 300, opacity: 0, scale: 0.7 }, { y: 0, opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.5)" }, 10);
      tl.to("#ar3", { rotation: -140, duration: 0.5, ease: "power2.out", yoyo: true, repeat: 3 }, 10.8);
      tl.fromTo("#t3", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power4.out" }, 10.3);
      tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 10.7);
      tl.fromTo("#heart3", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 11.2);
      tl.to("#heart3", { scale: 1.15, duration: 0.4, ease: "power2.inOut", yoyo: true, repeat: 2 }, 11.8);
      tl.to("#c3, #t3, #s3, #heart3", { opacity: 0, y: -80, scale: 0.9, filter: "blur(6px)", duration: 0.7, ease: "power3.in", stagger: 0.05 }, 14.0);

      window.__timelines["main"] = tl;
      tl.seek(0);

      // Preview helper (navegador directo)
      setTimeout(() => {
        if (!window.__renderReady) tl.play();
      }, 50);
    </script>
  </body>
</html>
