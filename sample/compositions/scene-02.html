<template>
  <style>
    #root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 70% 30%, #2a1f3a, #0f1220);
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    .char {
      position: absolute;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 260px;
    }
    .head {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c8cff, #ff6b9d);
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .eye { position: absolute; top: 90px; width: 44px; height: 56px; background: #fff; border-radius: 50%; overflow: hidden; }
    .eye.left { left: 60px; }
    .eye.right { right: 60px; }
    .pupil { position: absolute; top: 14px; left: 12px; width: 20px; height: 24px; background: #1a1f3a; border-radius: 50%; }
    .mouth { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); width: 90px; height: 30px; border-bottom: 6px solid #1a1f3a; border-radius: 0 0 60px 60px; }
    .arm { position: absolute; bottom: 40px; width: 24px; height: 120px; background: linear-gradient(180deg, #7c8cff, #ff6b9d); border-radius: 12px; transform-origin: top center; }
    .arm.left { left: 20px; }
    .arm.right { right: 20px; }
    .title {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-align: center;
    }
    .subtitle {
      position: absolute;
      top: 260px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 30px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ff6b9d;
      border-radius: 50%;
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="scene-02" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <h1 class="title clip" data-start="0.2" data-duration="4.8" data-track-index="0" id="title2">Motion</h1>
    <p class="subtitle clip" data-start="0.5" data-duration="4.5" data-track-index="0" id="sub2">Graphics</p>
    <div class="char clip" data-start="0" data-duration="5" data-track-index="1" id="char2">
      <div class="head">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="arm left" id="armL2"></div>
      <div class="arm right" id="armR2"></div>
    </div>
    <div class="particles clip" data-start="0" data-duration="5" data-track-index="2" id="particles2"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Personaje entra
    tl.fromTo("#char2",
      { x: -300, opacity: 0, rotation: -15 },
      { x: 0, opacity: 1, rotation: 0, duration: 0.7, ease: "power4.out" },
      0);

    // Brazos arriba (celebracion)
    tl.to("#armL2", { rotation: -120, duration: 0.4, ease: "back.out(1.4)", yoyo: true, repeat: 2 }, 0.6);
    tl.to("#armR2", { rotation: 120, duration: 0.4, ease: "back.out(1.4)", yoyo: true, repeat: 2 }, 0.7);

    // Titulo Motion
    tl.fromTo("#title2",
      { opacity: 0, scale: 0.5, filter: "blur(16px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" },
      0.2);

    // Subtitulo Graphics
    tl.fromTo("#sub2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.7);

    // Particulas (confeti simple)
    const container = document.getElementById("particles2");
    for (let i = 0; i < 18; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = (40 + Math.random() * 20) + "%";
      p.style.top = "45%";
      p.style.background = i % 2 === 0 ? "#ff6b9d" : "#7c8cff";
      container.appendChild(p);
      const angle = (i / 18) * Math.PI * 2;
      const dist = 120 + Math.random() * 80;
      tl.fromTo(p,
        { opacity: 1, x: 0, y: 0, scale: 1 },
        { opacity: 0, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist - 60, scale: 0.3, duration: 1.2, ease: "power2.out" },
        1.0);
    }

    // Salida
    tl.to("#char2, #title2, #sub2", { opacity: 0, y: -60, filter: "blur(8px)", duration: 0.5, ease: "power2.in", stagger: 0.05 }, 4.3);

    window.__timelines["scene-02"] = tl;
    tl.seek(0);
  </script>
</template>
